# cargo-deny configuration, the supply-chain gate run in CI (`cargo deny check`).
# Uses the v2 schema (cargo-deny >= 0.14) so no deprecated keys are present.

[advisories]
version = 2
# RUSTSEC advisories are a hard failure by default in v2. List IDs here only
# with a comment justifying each temporary exception.
ignore = []

[bans]
# Two copies of the same dependency bloat the binary and slow builds; warn so
# it stays visible without blocking day-to-day work.
multiple-versions = "warn"
# A wildcard ("*") version requirement is never acceptable in a shipped lockfile.
wildcards = "deny"
# Internal workspace crates are depended on by path with no version requirement,
# which reads as a wildcard. Both members are `publish = false`, so this exempts
# only those private path links; an external wildcard is still denied.
allow-wildcard-paths = true

[licenses]
version = 2
# Only licences actually present in the dependency tree are listed, so
# `cargo deny check` is warning-free. Adding a dependency under a new licence
# is a deliberate decision made here, in review, the check fails until the
# licence is added, which is the point.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0"]
confidence-threshold = 0.8

[sources]
# Only crates.io and explicitly allow-listed git sources are permitted.
unknown-registry = "deny"
unknown-git = "deny"
