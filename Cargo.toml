# ynotes — a workspace with three members.
#
#   crates/ynotes-core   the engine. Every behaviour lives here. The library
#                        crate; its lib target keeps the historical name
#                        `ynotes`, so `use ynotes::…` holds everywhere.
#   crates/ynotes-cli    a thin binary that parses arguments and renders the
#                        engine's results. Its modules (cli, commands, logging,
#                        command_error) are CLI-only — they cannot leak into the
#                        engine, which lives in a separate crate.
#   crates/ynotes-mcp    the MCP stdio server — the agent-facing front-end,
#                        spawned by `ynotes mcp`. Where async enters the
#                        workspace; it calls the sync engine via `spawn_blocking`.
#
# Engine plus two front-ends (CLI and MCP). Both reach the engine through the
# same library boundary; the engine references neither. See AGENTS.md.

[workspace]
resolver = "3"
members = ["crates/ynotes-core", "crates/ynotes-cli", "crates/ynotes-mcp"]

# Shared package metadata. Each member inherits these with `field.workspace =
# true`, so version, MSRV and licence live in one place.
[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV. Edition 2024 stabilised in 1.85, so that is the floor. Keep in sync
# with rust-toolchain.toml, clippy.toml and the `msrv` CI job.
rust-version = "1.85"
description = "Store code context that survives edits, and return only the context a query overlaps."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ars-2107/ynotes"
homepage = "https://github.com/ars-2107/ynotes"
authors = ["ynotes contributors"]
keywords = ["cli", "context", "annotations", "agents", "code"]
categories = ["command-line-utilities", "development-tools"]

# Lints. CI runs clippy with `-D warnings`, so every "warn" is a hard gate in
# CI while staying non-blocking for local iteration. Each member opts in with
# `[lints] workspace = true`.
[workspace.lints.rust]
# ynotes needs no `unsafe`. Forbid (not deny) so it cannot be re-enabled with
# a local `#[allow]`.
unsafe_code = "forbid"
# Documentation is part of the public API — see the comment doctrine in
# AGENTS.md.
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
let_underscore_drop = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are more noise than signal for a CLI of this size.
must_use_candidate = "allow"
module_name_repetitions = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

# Dependencies shared by both members are pinned here once and referenced with
# `dep.workspace = true`; crate-specific deps stay in each member's manifest.
[workspace.dependencies]
# Note records and the by-path index are JSON (machine artefacts like
# `.git/objects`).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

# --- Build profiles -------------------------------------------------------------

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"

# Optimise dependencies even in debug builds: a one-off cost that buys much
# faster test/debug runs.
[profile.dev.package."*"]
opt-level = 3
codegen-units = 1
debug = "line-tables-only"

# Ephemeral CI runners gain nothing from debuginfo or incremental artefacts.
[profile.ci]
inherits = "dev"
debug = false
incremental = false
