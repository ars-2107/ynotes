[package]
name = "ynotes-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
# ynotes is distributed via npm and GitHub Releases, not crates.io (see
# AGENTS.md -> Releases). `publish = false` makes `cargo publish` refuse, so
# the crate cannot reach a registry by accident.
publish = false
default-run = "ynotes"

[[bin]]
# The binary keeps the historical name `ynotes`; the package rename to
# `ynotes-cli` is workspace-level identity, not the invoked command.
name = "ynotes"
path = "src/main.rs"
# The engine's lib target is also named `ynotes`, so documenting this bin would
# collide with it at `target/doc/ynotes` (cargo issue #6313). The single-crate
# layout skipped the bin's docs for the same reason; keep that behaviour so
# `cargo doc` produces the engine's API docs alone, as before.
doc = false

[lints]
workspace = true

[dependencies]
# The engine. The path dependency resolves the lib target `ynotes`, so
# `use ynotes::…` needs no alias.
ynotes-core = { path = "../ynotes-core" }
# The MCP front-end, reached only by the `mcp` subcommand. It owns the async
# runtime; the CLI itself stays synchronous.
ynotes-mcp = { path = "../ynotes-mcp" }
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
# Black-box testing of the built binary.
assert_cmd = "2"
predicates = "3"
# Snapshot testing. A natural fit for ynotes's structured drift/diff output:
# assert on rendered text, review changes as diffs.
insta = "1"
# Validates real `--json` output against the published `ynotes.schema.json`, so
# the stable, versioned agent contract (invariant #7) cannot drift from the
# schema file undetected. Test-only; never linked into the shipped binary.
jsonschema = { version = "0.46", default-features = false }
tempfile = "3"
